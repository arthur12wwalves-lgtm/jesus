<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Controle Financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:28px 20px}header .wrap{max-width:1050px;margin:auto}h1{margin:0 0 6px;font-size:28px}.sub{color:#cbd5e1}.wrap{max-width:1050px;margin:auto;padding:24px 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 6px 20px #0000000b}.label{font-size:14px;color:#64748b}.value{font-size:26px;font-weight:750;margin-top:8px}.entrada{color:#16803a}.saida{color:#c2410c}.saldo{color:#4338ca}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 6px 20px #0000000b}h2{font-size:19px;margin:0 0 16px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,button{width:100%;padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}button{border:0;background:#4f46e5;color:white;font-weight:700;cursor:pointer;margin-top:14px}button:hover{filter:brightness(.95)}.transactions{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eef2f7;font-size:14px}th{color:#64748b;font-size:12px}.pill{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.pill.in{background:#dcfce7;color:#166534}.pill.out{background:#ffedd5;color:#9a3412}.delete{background:transparent;color:#dc2626;width:auto;padding:5px;margin:0;font-size:12px}.empty{text-align:center;color:#94a3b8;padding:25px}.hint{font-size:12px;color:#94a3b8;margin-top:10px}@media(max-width:760px){.cards,.grid{grid-template-columns:1fr}.cards{gap:10px}.value{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Meu Controle Financeiro</h1><div class="sub">Acompanhe suas entradas, saídas e saldo em um só lugar.</div></div></header>
<main class="wrap">
<section class="cards"><div class="card"><div class="label">Total de entradas</div><div id="income" class="value entrada">R$ 0,00</div></div><div class="card"><div class="label">Total de saídas</div><div id="expense" class="value saida">R$ 0,00</div></div><div class="card"><div class="label">Saldo atual</div><div id="balance" class="value saldo">R$ 0,00</div></div></section>
<section class="grid"><div class="panel"><h2>Adicionar movimentação</h2><form id="form"><label>Descrição</label><input id="description" required placeholder="Ex.: Salário, mercado, gasolina..."><label>Valor (R$)</label><input id="amount" required type="number" min="0.01" step="0.01" placeholder="0,00"><label>Tipo</label><select id="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select><label>Categoria</label><select id="category"><option>Salário</option><option>Alimentação</option><option>Transporte</option><option>Moradia</option><option>Lazer</option><option>Estudos</option><option>Outros</option></select><button type="submit">Adicionar movimentação</button></form><div class="hint">Os dados ficam salvos neste navegador.</div></div>
<div class="panel"><h2>Movimentações</h2><div class="transactions"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody id="list"></tbody></table></div></div></section>
</main>
<script>
const key='controle-financeiro-v1';let items=JSON.parse(localStorage.getItem(key)||'[]');
const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function render(){const income=items.filter(x=>x.type==='entrada').reduce((s,x)=>s+x.amount,0),expense=items.filter(x=>x.type==='saida').reduce((s,x)=>s+x.amount,0);document.querySelector('#income').textContent=money(income);document.querySelector('#expense').textContent=money(expense);document.querySelector('#balance').textContent=money(income-expense);const list=document.querySelector('#list');list.innerHTML=items.length?items.map((x,i)=>`<tr><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td><span class="pill ${x.type==='entrada'?'in':'out'}">${x.type==='entrada'?'Entrada':'Saída'}</span></td><td>${money(x.amount)}</td><td><button class="delete" onclick="removeItem(${i})">Excluir</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhuma movimentação cadastrada.</td></tr>';localStorage.setItem(key,JSON.stringify(items))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function removeItem(i){items.splice(i,1);render()}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const amount=Number(document.querySelector('#amount').value);if(!amount||amount<=0)return;items.unshift({description:document.querySelector('#description').value.trim(),amount,type:document.querySelector('#type').value,category:document.querySelector('#category').value});e.target.reset();render()});render();
</script>
</body></html>
